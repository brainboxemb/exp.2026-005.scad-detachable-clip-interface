paths:
  design_root: dsg
  build_root: bld
  render_roots:
    - dsg/openscad/render
    - dsg/openscad/render2d
  export_root: dsg/openscad/export

design:
  include_externals: false

build_engine:
  engine: scons

openscad:
  render_flags:
    - --render
  image_size: [1600, 1000]
  design_image_size: [640, 480]

# Composed technical drawings are project-owned. The Python producer keeps the
# canonical SVG editable/inspectable and invokes Inkscape for PNG/PDF output.
drawing:
  command:
    - python3
    - dsg/drawing/build_opengrid_profile.py
  inputs:
    - dsg/drawing/build_opengrid_profile.py
    - dsg/drawing/opengrid_fixed_profile_sources.scad
  outputs:
    - bld/drawing/00-opengrid-fixed-profile-a4.svg
    - bld/drawing/00-opengrid-fixed-profile-a4.png
    - bld/drawing/00-opengrid-fixed-profile-a4.pdf

rendering:
  watermark:
    text: "© 2026 brainboxemb"

externals:
  - name: quackworks
    required_file: openGrid/opengrid-snap.scad

publication:
  production:
    source_branch: main
    build_branch: prod/bld
    verification_branch: prod/vrf

  development:
    pr_branch_prefix: dev/pr

  tags:
    pattern: "v*"

  release:
    branch_prefix: rel
    tag_pattern: "v*"
