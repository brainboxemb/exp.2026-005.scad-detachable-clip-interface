paths:
  design_root: dsg
  build_root: bld
  render_roots:
    - dsg/openscad/render
    - dsg/openscad/render2d
  export_root: dsg/openscad/export

design:
  include_externals: false

build_engine:
  engine: scons

openscad:
  render_flags:
    - --render
  image_size: [1600, 1000]
  design_image_size: [640, 480]

# Geometry-learning drawing test.  Python reconstructs the pinned source in
# model millimetres; OpenSCAD is an independent reference used only for overlay
# validation.
drawing:
  command:
    - python3
    - dsg/drawing/build_opengrid_profile.py
  inputs:
    - dsg/drawing/build_opengrid_profile.py
    - dsg/drawing/opengrid_profile_geometry.py
    - dsg/drawing/opengrid_profile_render.py
    - dsg/drawing/opengrid_lite_plan_slice_reference.scad
  outputs:
    - bld/drawing/00-opengrid-python.svg
    - bld/drawing/00-opengrid-python.png
    - bld/drawing/01-opengrid-openscad-reference.svg
    - bld/drawing/01-opengrid-openscad-reference.png
    - bld/drawing/02-opengrid-overlay.svg
    - bld/drawing/02-opengrid-overlay.png

rendering:
  watermark:
    text: "© 2026 brainboxemb"

externals:
  - name: quackworks
    required_file: openGrid/opengrid-snap.scad
  - name: lib.scad.util
    required_file: openscad/inspection.scad

publication:
  production:
    source_branch: main
    build_branch: prod/bld
    verification_branch: prod/vrf

  development:
    pr_branch_prefix: dev/pr

  tags:
    pattern: "v*"

  release:
    branch_prefix: rel
    tag_pattern: "v*"
