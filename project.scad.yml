paths:
  design_root: dsg
  build_root: bld
  render_roots:
    - dsg/openscad/render
    - dsg/openscad/render2d
  export_root: dsg/openscad/export

design:
  include_externals: false

build_engine:
  engine: scons

openscad:
  render_flags:
    - --render
  image_size: [1600, 1000]
  design_image_size: [640, 480]

# First drawing-language test: one simple OpenGrid-style outline only.
# Keep this intentionally small until the visual convention is accepted.
drawing:
  command:
    - python3
    - dsg/drawing/build_opengrid_profile.py
  inputs:
    - dsg/drawing/build_opengrid_profile.py
  outputs:
    - bld/drawing/00-opengrid-outline-test.svg
    - bld/drawing/00-opengrid-outline-test.png

rendering:
  watermark:
    text: "© 2026 brainboxemb"

externals:
  - name: quackworks
    required_file: openGrid/opengrid-snap.scad
  - name: lib.scad.util
    required_file: openscad/inspection.scad

publication:
  production:
    source_branch: main
    build_branch: prod/bld
    verification_branch: prod/vrf

  development:
    pr_branch_prefix: dev/pr

  tags:
    pattern: "v*"

  release:
    branch_prefix: rel
    tag_pattern: "v*"
